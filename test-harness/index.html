<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Test Harness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>MCP Test Harness</h1>
  <p>This page is designed for testing the Chrome DevTools MCP integration.</p>

  <div class="card">
    <h2>Console Error</h2>
    <p>Click the button below to trigger a JavaScript error.</p>
    <button id="error-btn">Trigger Error</button>
  </div>

  <div class="card">
    <h2>Network Error</h2>
    <p>This image will fail to load, causing a 404 error.</p>
    <img src="non-existent-image.jpg" alt="A broken image">
  </div>

  <div class="card">
    <h2>Form</h2>
    <form id="test-form">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email">
      <button type="submit">Submit</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
